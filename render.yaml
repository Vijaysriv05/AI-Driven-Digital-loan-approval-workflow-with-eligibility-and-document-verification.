services:
  # Unified Single Docker Web Service (Frontend + Backend)
  - type: web
    name: nimbus-lending-app
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: Dockerfile
    envVars:
      - key: PORT
        value: 5000
      - key: DB_HOST
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_PORT
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GROQ_API_KEY
        sync: false

